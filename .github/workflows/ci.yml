name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-mnotes-refs:
    name: "Validate `mnotes <cmd>` references"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Smoke-test CLI references
        run: node scripts/check-mnotes-refs.mjs
